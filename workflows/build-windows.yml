name: Build RadioCastOS for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show build environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Python:"
          python --version
          Write-Host "Pip:"
          python -m pip --version
          Write-Host "OS: $([Environment]::OSVersion.VersionString)"
          Write-Host "PWD: $PWD"
          Get-ChildItem -Name

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m PyInstaller --version

      - name: Validate Python source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "src")) { throw "src/ folder is missing from the repository." }
          if (-not (Test-Path "src/main.py")) { throw "src/main.py is missing." }
          if (-not (Test-Path "build.spec")) { throw "build.spec is missing." }
          if (-not (Test-Path "installer.iss")) { throw "installer.iss is missing." }
          if (-not (Test-Path "scripts/validate_imports.py")) { throw "scripts/validate_imports.py is missing." }

          python -m compileall -q src
          if ($LASTEXITCODE -ne 0) { throw "Python source compilation failed." }

          python scripts/validate_imports.py
          if ($LASTEXITCODE -ne 0) { throw "Source import validation failed." }

      - name: Download FFmpeg runtime binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $assets = Join-Path $PWD "assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null

          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extract = Join-Path $env:RUNNER_TEMP "ffmpeg-extracted"

          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue

          $downloaded = $false
          foreach ($attempt in 1..3) {
            try {
              Write-Host "Downloading FFmpeg (attempt $attempt of 3) from $url ..."
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
              $downloaded = $true
              break
            } catch {
              Write-Warning "Download attempt $attempt failed: $($_.Exception.Message)"
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not $downloaded) { throw "Failed to download FFmpeg after 3 attempts." }

          if (-not (Test-Path $zip)) { throw "FFmpeg zip was not downloaded." }
          Write-Host "Download size: $((Get-Item $zip).Length) bytes"

          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $ffmpeg = Get-ChildItem $extract -Recurse -File -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffplay = Get-ChildItem $extract -Recurse -File -Filter "ffplay.exe" | Select-Object -First 1

          if (-not $ffmpeg) { throw "ffmpeg.exe was not found in the downloaded archive." }
          if (-not $ffplay) { throw "ffplay.exe was not found in the downloaded archive." }

          Copy-Item $ffmpeg.FullName (Join-Path $assets "ffmpeg.exe") -Force
          Copy-Item $ffplay.FullName (Join-Path $assets "ffplay.exe") -Force

          if (-not (Test-Path (Join-Path $assets "ffmpeg.exe"))) { throw "FFmpeg staging failed." }
          if (-not (Test-Path (Join-Path $assets "ffplay.exe"))) { throw "FFplay staging failed." }

          & (Join-Path $assets "ffmpeg.exe") -version | Select-Object -First 1
          Write-Host "FFmpeg runtime binaries staged successfully."

      - name: Clean previous build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -Recurse -Force build, dist, Output -ErrorAction SilentlyContinue

      - name: Build application with PyInstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m PyInstaller --noconfirm --clean build.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed with exit code $LASTEXITCODE." }

          $exe = Join-Path $PWD "dist\RadioCastOS\RadioCastOS.exe"
          if (-not (Test-Path $exe)) { throw "Expected executable was not created: $exe" }
          Write-Host "Built: $exe ($((Get-Item $exe).Length) bytes)"

      - name: Smoke test portable EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $PWD "dist\RadioCastOS\RadioCastOS.exe"
          $stdout = Join-Path $PWD "smoke-test-stdout.log"
          $stderr = Join-Path $PWD "smoke-test-stderr.log"

          try {
            $proc = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr -WindowStyle Hidden
            Start-Sleep -Seconds 8

            if ($proc.HasExited) {
              Write-Warning "RadioCastOS exited during smoke test with code $($proc.ExitCode)."
              if (Test-Path $stdout) { Get-Content $stdout }
              if (Test-Path $stderr) { Get-Content $stderr }
              Write-Warning "Smoke test failed but the package was built. Continuing to installer."
            } else {
              Write-Host "RadioCastOS remained running for 8 seconds. Startup test passed."
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          } catch {
            Write-Warning "Smoke test could not be completed: $($_.Exception.Message)"
            Write-Warning "Continuing because the PyInstaller package already exists."
          }

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RadioCastOS-smoke-test-logs
          path: |
            smoke-test-stdout.log
            smoke-test-stderr.log
          if-no-files-found: ignore

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Find-Iscc {
            $found = @()
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $found += $cmd.Source }
            foreach ($root in @(${env:ProgramFiles(x86)}, $env:ProgramFiles, "$env:LOCALAPPDATA\Programs")) {
              if ($root -and (Test-Path $root)) {
                Get-ChildItem -Path $root -Filter "Inno Setup*" -Directory -ErrorAction SilentlyContinue |
                  ForEach-Object { $found += (Join-Path $_.FullName "ISCC.exe") }
              }
            }
            $found | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (Find-Iscc) {
            Write-Host "Inno Setup already present: $(Find-Iscc)"
          } else {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -notin 0, 1641, 3010) { throw "choco install innosetup failed with exit code $LASTEXITCODE." }
          }

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $isccPath = $null
          $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($cmd) { $isccPath = $cmd.Source }
          if (-not $isccPath) {
            foreach ($root in @(${env:ProgramFiles(x86)}, $env:ProgramFiles, "$env:LOCALAPPDATA\Programs")) {
              if ($root -and (Test-Path $root)) {
                $hit = Get-ChildItem -Path $root -Filter "Inno Setup*" -Directory -ErrorAction SilentlyContinue |
                  ForEach-Object { Join-Path $_.FullName "ISCC.exe" } | Where-Object { Test-Path $_ } | Select-Object -First 1
                if ($hit) { $isccPath = $hit; break }
              }
            }
          }
          if (-not $isccPath) { throw "Inno Setup compiler (ISCC.exe) was not found." }

          Write-Host "Using Inno Setup: $isccPath"
          & $isccPath (Join-Path $PWD "installer.iss")
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }

          $installer = Join-Path $PWD "Output\RadioCastOS-Setup.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not created: $installer" }
          Write-Host "Installer created: $installer ($((Get-Item $installer).Length) bytes)"

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: RadioCastOS-Windows-Portable
          path: dist/RadioCastOS/
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RadioCastOS-Windows-Installer
          path: Output/RadioCastOS-Setup.exe
          if-no-files-found: error
